# Hyprland.conf — Config Hyprland minimale & fluide (Style macOS / Apple Silicon)

# --- Variables de base ---
$terminal = kitty
$filemanager = kitty -e yazi
$menu = quicklauncher
$mainMod = ALT      # Touche Option (Alt) sur le clavier Mac
$secondMod = CTRL

# --- Thème du curseur de souris ---
# Curseur minimaliste style macOS (apple-cursor)
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,macOS
env = HYPRCURSOR_SIZE,24

# --- Services au démarrage (Autostart) ---
exec-once = awww-daemon --format xrgb          # Gestionnaire de fond d'écran
exec-once = handy --start-hidden                 # Dictée vocale locale / Speech-to-text
exec-once = wlsunset -l 48.85 -long 2.35        # Ajustement de la température d'écran (Paris)

# --- Écran MacBook Pro M2 ---
monitor = eDP-1, 3024x1964@120, auto, 1.6
debug:disable_scale_checks = true

# --- Clavier & Trackpad ---
input {
	kb_layout = fr
	kb_variant = mac

	touchpad {
		natural_scroll = true
		clickfinger_behavior = true
		tap-to-click = false
		scroll_factor = 0.25
	}
}

# --- Style global des fenêtres ---
general {
	gaps_in = 6
	gaps_out = 12
	border_size = 0
	col.active_border = rgba(E3AC97ff)
	col.inactive_border = rgba(1e1e2eaa)
	layout = dwindle
	resize_on_border = true
}

# --- Coins arrondis & Transparence ---
decoration {
	rounding = 18

	active_opacity = 0.9
	inactive_opacity = 0.6

	blur {
		enabled = true
		size = 5
		passes = 3
		new_optimizations = true
		xray = false
		ignore_opacity = true
	}

	shadow {
		enabled = true
		range = 15
		render_power = 3
		color = rgba(11111b66)
	}
}

# --- Animations fluides ---
animations {
	enabled = true
	bezier = easeOutExpo, 0.16, 1, 0.3, 1
	bezier = easeOutQuint, 0.23, 1, 0.32, 1
	bezier = easeInOutCubic, 0.65, 0, 0.35, 1
	bezier = linear, 0, 0, 1, 1

	animation = windows, 1, 2, easeOutExpo, popin 85%
	animation = windowsOut, 1, 2, easeOutExpo, popin 85%
	animation = border, 0, 1, default
	animation = fade, 1, 2, default
	animation = workspaces, 1, 2.5, easeOutExpo, slide
}

dwindle {
	preserve_split = true
}

# ==============================================================================
# RACCOURCIS CLAVIER (KEYBINDINGS)
# ==============================================================================

# --- Lancement d'applications ---
bind = CTRL, Return, exec, $terminal
bind = $secondMod, Return, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = SUPER, Return, exec, $terminal

bind = $mainMod, E, exec, $filemanager                # Explorateur de fichiers Yazi (Option + E)
bind = SUPER, E, exec, $filemanager
bind = SUPER, Space, exec, $menu                      # Lanceur Quicklauncher (Cmd + Espace)
bind = $mainMod, W, exec, /home/lena/dotfiles/home/scripts/wallselect.sh   # Rofi Wallpaper picker
bind = $mainMod, T, exec, /home/lena/dotfiles/home/scripts/toggle-theme.sh   # Switcher de thème

# --- Dictée Vocale Handy ---
bind = $mainMod, Space, exec, handy --toggle-transcription
bind = SUPER ALT, Space, exec, handy
bind = SUPER SHIFT, Space, exec, handy --toggle-transcription
bind = $mainMod SHIFT, Space, exec, handy --toggle-transcription

# --- Gestion des fenêtres ---
bind = $mainMod, Q, killactive                        # Fermer la fenêtre active (Option + Q)
bind = SUPER, Q, killactive                           # Fermer la fenêtre active (Cmd + Q)
bind = $mainMod, M, exit                              # Quitter Hyprland (Option + M)
bind = $mainMod, V, togglefloating                    # Basculer le mode flottant (Option + V)
bind = $secondMod, F, fullscreen                      # Plein écran (Ctrl + F)
bind = $mainMod CTRL, F, fullscreen                   # Plein écran (Option + Ctrl + F)
bind = $mainMod, P, layoutmsg, togglesplit            # Basculer le split horizontal / vertical (Option + P)
bind = SUPER, P, layoutmsg, togglesplit

# --- Navigation entre fenêtres (Touches Vim & Flèches) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# --- Déplacer une fenêtre au clavier ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Redimensionner une fenêtre au clavier ---
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# --- Contrôle du volume ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Navigation entre bureaux virtuels (Workspaces) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

# Variantes AZERTY Mac
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = SUPER, ampersand, workspace, 1
bind = SUPER, eacute, workspace, 2
bind = SUPER, quotedbl, workspace, 3
bind = SUPER, apostrophe, workspace, 4

# --- Déplacer une fenêtre vers un bureau virtuel ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = SUPER SHIFT, ampersand, movetoworkspace, 1
bind = SUPER SHIFT, eacute, movetoworkspace, 2
bind = SUPER SHIFT, quotedbl, movetoworkspace, 3
bind = SUPER SHIFT, apostrophe, movetoworkspace, 4

# --- Contrôle à la souris / trackpad ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
