backend = "glx";
vsync = true;

# rounded, borderless windows
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# focus is shown by opacity (no borders): focused solid, unfocused see-through
active-opacity = 1.0;
inactive-opacity = 0.86;
opacity-rule = [
  "100:_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "100:class_g = 'Rofi'"
];

# frosted glass behind transparent windows and the bar
blur: { method = "dual_kawase"; strength = 5; };
blur-background-exclude = [ "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'" ];

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [ "window_type = 'dock'" ];

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
