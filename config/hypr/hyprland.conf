
# Variables
$terminal = kitty
$menu = quicklauncher
$mainMod = ALT
$secondMod = CTRL

# Autostart
exec-once = awww-daemon --format xrgb
exec-once = quickshell
exec-once = handy --start-hidden
exec-once = wlsunset -l 48.85 -long 2.35 # Paris Night Light

# Retina display (MacBook Pro M2 Pro 14")
monitor = eDP-1, 3024x1964@120, auto, 1.6
debug:disable_scale_checks = true

# Configuration Clavier Mac FR + Touchpad
input {
	kb_layout = fr
	kb_variant = mac

	touchpad {
		natural_scroll = true
		clickfinger_behavior = true
		tap-to-click = false
		scroll_factor = 0.25
	}
}

# Style Visuel Minimaliste & Ultra-Propre (Catppuccin Mocha)
general {
	gaps_in = 6
	gaps_out = 12
	border_size = 2
	col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
	col.inactive_border = rgba(1e1e2eaa)
	layout = dwindle
	resize_on_border = true
}

decoration {
	rounding = 18

	active_opacity = 0.96
	inactive_opacity = 0.88

	blur {
		enabled = true
		size = 6
		passes = 3
		new_optimizations = true
		xray = false
		ignore_opacity = true
	}

	shadow {
		enabled = true
		range = 15
		render_power = 3
		color = rgba(11111b66)
	}
}

# Animations Ultra-Fluides et Réactives
animations {
	enabled = true
	bezier = easeOutQuint, 0.23, 1, 0.32, 1
	bezier = easeInOutCubic, 0.65, 0, 0.35, 1
	bezier = linear, 0, 0, 1, 1

	animation = windows, 1, 4, easeOutQuint, popin 80%
	animation = windowsOut, 1, 3, easeInOutCubic, popin 80%
	animation = border, 1, 6, default
	animation = fade, 1, 4, default
	animation = workspaces, 1, 4, easeOutQuint, slide
}

dwindle {
	preserve_split = true
}

# Raccourcis Clavier
bind = CTRL, Return, exec, $terminal
bind = $secondMod, Return, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = SUPER, Return, exec, $terminal

bind = $mainMod, Q, killactive
bind = SUPER, Q, killactive
bind = $mainMod, M, exit
bind = SUPER, Space, exec, $menu
bind = $mainMod, W, exec, /home/lena/dotfiles/home/scripts/wallselect.sh
bind = $mainMod, Space, exec, handy --toggle-transcription
bind = SUPER ALT, Space, exec, handy
bind = SUPER SHIFT, Space, exec, handy --toggle-transcription
bind = $mainMod SHIFT, Space, exec, handy --toggle-transcription

# Audio Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Dynamic Window Management
bind = $mainMod, V, togglefloating
bind = $secondMod, F, fullscreen
bind = $mainMod CTRL, F, fullscreen

# Navigation Focus (Vim Style & Super Keys)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# Navigation Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = SUPER, ampersand, workspace, 1
bind = SUPER, eacute, workspace, 2
bind = SUPER, quotedbl, workspace, 3
bind = SUPER, apostrophe, workspace, 4

# Move to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = SUPER SHIFT, ampersand, movetoworkspace, 1
bind = SUPER SHIFT, eacute, movetoworkspace, 2
bind = SUPER SHIFT, quotedbl, movetoworkspace, 3
bind = SUPER SHIFT, apostrophe, movetoworkspace, 4

# Mouse Bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
