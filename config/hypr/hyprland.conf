# Hyprland.conf

# --- Variables de base ---
$terminal = kitty
$filemanager = kitty -e yazi
$browser = helium
$menu = quicklauncher
$mainMod = ALT
$secondMod = CTRL

# --- Thème du curseur de souris ---
# Curseur minimaliste style macOS (apple-cursor)
env = XCURSOR_THEME,macOS
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,macOS
env = HYPRCURSOR_SIZE,24

# --- Services au démarrage (Autostart) ---
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user restart quickshell
exec-once = awww-daemon --format xrgb          # Gestionnaire de fond d'écran
exec-once = handy --start-hidden                 # Dictée vocale locale / Speech-to-text
exec-once = wlsunset -l 48.85 -long 2.35        # Ajustement de la température d'écran (Paris)
exec-once = clipse -listen                      # Gestionnaire de presse-papier Clipse

# --- Gestion du Clapet MacBook (Lid Switch / Veille) ---
bindl = , switch:on:Lid Switch, exec, systemctl suspend
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# --- Écran MacBook Pro M2 ---
monitor = eDP-1, 3024x1964@120, auto, 1.5625
debug:disable_scale_checks = true

# --- Clavier & Trackpad ---
input {
	kb_layout = fr
	kb_variant = mac

	touchpad {
		natural_scroll = true
		clickfinger_behavior = true
		tap-to-click = false
		scroll_factor = 0.25
	}
}

# --- Windows styling ---
general {
	gaps_in = 6
	gaps_out = 12
	border_size = 0
	col.active_border = rgba(E3AC97ff)
	col.inactive_border = rgba(1e1e2eaa)
	layout = dwindle
	resize_on_border = true
}

# --- Coins arrondis & Transparence ---
decoration {
	rounding = 18

	active_opacity = 0.9
	inactive_opacity = 0.6

	blur {
		enabled = true
		size = 4
		passes = 1
		new_optimizations = true
		xray = false
		ignore_opacity = true
	}

	shadow {
		enabled = true
		range = 15
		render_power = 3
		color = rgba(11111b66)
	}
}

# --- Animations fluides ---
animations {
	enabled = true
	bezier = easeOutExpo, 0.16, 1, 0.3, 1
	bezier = easeOutQuint, 0.23, 1, 0.32, 1
	bezier = easeInOutCubic, 0.65, 0, 0.35, 1
	bezier = linear, 0, 0, 1, 1

	animation = windows, 1, 2, easeOutExpo, popin 85%
	animation = windowsOut, 1, 2, easeOutExpo, popin 85%
	animation = border, 0, 1, default
	animation = fade, 1, 2, default
	animation = workspaces, 1, 2.5, easeOutExpo, slide
}

dwindle {
	preserve_split = true
}

# --- Règles de fenêtres (Floating TUI & Flameshot) ---
windowrule = match:class floating-tui, float true
windowrule = match:class floating-tui, center true
windowrule = match:class floating-tui, size 700 480

windowrule = match:class ^(flameshot)$, float true
windowrule = match:class ^(flameshot)$, move 0 0
windowrule = match:class ^(flameshot)$, no_anim true

# ==============================================================================
# RACCOURCIS CLAVIER (KEYBINDINGS)
# ==============================================================================

# --- Lancement d'applications ---
bind = SUPER, Return, exec, $terminal
bind = SUPER SHIFT, V, exec, kitty --class floating-tui clipse # Presse-papier Clipse instantané (Cmd + Shift + V)
bind = SUPER SHIFT, S, exec, flameshot gui             # Capture d'écran Flameshot (Cmd + Shift + S)
bind = , Print, exec, flameshot gui                     # Capture d'écran Flameshot (Touche Impredr / PrintScreen)
bind = SUPER, O, exec, kitty -e nvim /home/lena/Garden             # Ouvrir Neovim dans ~/Garden (Option + O)
bind = SUPER, V, exec, kitty -e nvim                  # Ouvrir Neovim (Option + V)
bind = SUPER, E, exec, $filemanager                   # Explorateur de fichiers Yazi (Cmd + E)
bind = SUPER, B, exec, $browser                       # Ouvrir le browser (Cmd + B)
bind = SUPER, Space, exec, $menu                      # Lanceur Quicklauncher (Cmd + Espace)
bind = SUPER, W, exec, /home/lena/dotfiles/home/scripts/wallselect.sh   # Rofi Wallpaper picker
bind = $mainMod, T, exec, /home/lena/dotfiles/home/scripts/toggle-theme.sh   # Switcher de thème
bind = $mainMod, B, exec, /home/lena/dotfiles/home/scripts/power_save.sh toggle # Bascule mode d'énergie (Perf / Eco / Ultra-Eco)

# --- Dictée Vocale Handy ---
bind = $mainMod, Space, exec, handy --toggle-transcription

# --- Sleep Mode ---
bind = $mainMod SHIFT, S, exec, systemctl suspend    # Mettre en veille (Option + Shift + S)

# --- Gestion des fenêtres ---
bind = $mainMod, Q, killactive                        # Fermer la fenêtre active (Option + Q)
bind = $secondMod SHIFT, Escape, exit                 # Quitter Hyprland (Ctrl + Shift + Echap)
bind = $mainMod, V, togglefloating                    # Basculer le mode flottant (Option + V)
bind = $mainMod, F, fullscreen                        # Plein écran (Option + F)
bind = $mainMod, P, layoutmsg, togglesplit            # Basculer le split horizontal / vertical (Option + P)

# --- Navigation entre fenêtres (Touches Vim & Flèches) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d

# --- Déplacer une fenêtre au clavier ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Redimensionner une fenêtre au clavier ---
binde = $mainMod $secondMod, H, resizeactive, -40 0
binde = $mainMod $secondMod, L, resizeactive, 40 0
binde = $mainMod $secondMod, K, resizeactive, 0 -40
binde = $mainMod $secondMod, J, resizeactive, 0 40
binde = $mainMod $secondMod, left, resizeactive, -40 0
binde = $mainMod $secondMod, right, resizeactive, 40 0
binde = $mainMod $secondMod, up, resizeactive, 0 -40
binde = $mainMod $secondMod, down, resizeactive, 0 40

# --- Contrôle du volume ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Navigation entre bureaux virtuels (Workspaces) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Variantes AZERTY Mac
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5

# --- Déplacer une fenêtre vers un bureau virtuel ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5

# --- Contrôle à la souris / trackpad ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
