backend = "glx";
vsync = true;
corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'xmobar'" ];
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [ "window_type = 'dock'", "class_g = 'xmobar'" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
inactive-opacity = 1.0;
