
# Variables
$terminal = kitty
$menu = quicklauncher
$mainMod = ALT
$secondMod = CTRL

# Autostart
exec-once = quickshell

# Retina screen
monitor=eDP-1,3024x1964@120,auto,2

# Keyboard plssss
input {
	kb_layout = fr
	kb_variant = mac
	# kb_options = ctrl:swap_lwin_lctl

	touchpad {
		natural_scroll = true
		clickfinger_behavior = true
		tap-to-click = false
		scroll_factor = 0.2
	}
}

# lil esthetic tweaks
general {
	gaps_in = 4
	gaps_out = 0
	border_size = 2
	col.active_border = rgba(888888aa)
	col.inactive_border = rgba(333333aa)
	layout = dwindle
}

decoration {
	rounding = 8
	blur {
		enabled = true
		size = 4
		passes = 2
	}
}

debug {
	disable_logs = false
}

# Window rules

animations {
	enabled = true
	bezier = myBezier, 0.05, 0.9, 0.1, 1.05
	animation = windows, 1, 4, myBezier
	animation = windowsOut, 1, 4, default, popin 80%
	animation = border, 1, 5, default
	animation = fade, 1, 4, default
	animation = workspaces, 1, 3, default
}










 ##########################
 #                        #
 #  Keyboard adjustments  #
 #                        #
 ##########################

# Keyboard shortcuts
bind = CTRL, Return, exec, $terminal
bind = $secondMod, Return, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = SUPER, Return, exec, $terminal

bind = $mainMod, Q, killactive
bind = SUPER, Q, killactive
bind = $mainMod, M, exit
bind = SUPER, Space, exec, $menu
# Volume & Audio control shortcuts
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = $mainMod, V, togglefloating
bind = $secondMod, F, fullscreen
bind = $mainMod CTRL, F, fullscreen

## Moving focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, u
bind = $mainMod, K, movefocus, d

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, J, movefocus, u
bind = SUPER, K, movefocus, d

## Workspaces (1, 2, 3, 4 - AZERTY & QWERTY)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = SUPER, ampersand, workspace, 1
bind = SUPER, eacute, workspace, 2
bind = SUPER, quotedbl, workspace, 3
bind = SUPER, apostrophe, workspace, 4

## Move to Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
